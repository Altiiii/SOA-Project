name: Backend Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: AIStudyCoachPRO
        run: dotnet restore AIStudyCoachPRO.sln

      - name: Build solution
        working-directory: AIStudyCoachPRO
        run: dotnet build AIStudyCoachPRO.sln --no-restore --configuration Release

      - name: Run tests
        working-directory: AIStudyCoachPRO
        run: dotnet test AIStudyCoachPRO.sln --no-build --configuration Release --verbosity normal
