name: Frontend Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: AIStudyCoachFrontend/package-lock.json

      - name: Install dependencies
        working-directory: AIStudyCoachFrontend
        run: npm install

      - name: Build production bundle
        working-directory: AIStudyCoachFrontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://aistudycoach-gateway.azurewebsites.net/gateway
